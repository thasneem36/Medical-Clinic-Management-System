<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediFlow ERP - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#005049",
                        "surface-tint": "#006398",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-container": "#006f66",
                        "on-secondary-fixed": "#00201d",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-background": "#0b1c30",
                        "primary-container": "#007bb9",
                        "primary": "#006194",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#3f4850",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "on-primary-fixed": "#001d31",
                        "secondary": "#006a61",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed": "#e0e3e5",
                        "on-primary-container": "#fdfcff",
                        "on-surface": "#0b1c30",
                        "error-container": "#ffdad6",
                        "surface-container": "#e5eeff",
                        "primary-fixed-dim": "#93ccff",
                        "inverse-surface": "#213145",
                        "inverse-primary": "#93ccff",
                        "outline-variant": "#bfc7d2",
                        "secondary-fixed": "#89f5e7",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#444749",
                        "secondary-fixed-dim": "#6bd8cb",
                        "tertiary-container": "#727577",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-container": "#fbfdff",
                        "on-primary-fixed-variant": "#004b73",
                        "outline": "#707881",
                        "on-tertiary-fixed": "#191c1e",
                        "primary-fixed": "#cce5ff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "surface": "#f8f9ff",
                        "tertiary": "#595c5e",
                        "background": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-container": "#86f2e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1.5rem",
                        "stack-sm": "0.5rem",
                        "sidebar-width": "260px",
                        "margin-page": "2rem",
                        "stack-md": "1rem",
                        "stack-lg": "2rem"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md">
<!-- Main Container -->
<main class="w-full max-w-md px-margin-page">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.05)] border border-outline-variant/30 p-8 flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<!-- Brand / Logo Area -->
<div class="flex items-center gap-2 mb-2">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined" data-icon="health_and_safety" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<span class="font-headline-md text-headline-md text-primary">MediFlow ERP</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your credentials to access the system.</p>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm min-h-[44px] transition-shadow duration-200" id="email" name="email" placeholder="doctor@mediflow.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-bright text-on-surface focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm min-h-[44px] transition-shadow duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary min-h-[44px] transition-colors duration-200 mt-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Footer -->
<div class="mt-4 text-center">
<p class="font-label-md text-label-md text-outline-variant uppercase tracking-wider">
                    Role-based access system
                </p>
<div class="flex items-center justify-center gap-1 mt-2 text-outline-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
<span class="text-[10px]">Secure Encrypted Connection</span>
</div>
</div>
</div>
</main>
</body></html>
